version: "3.8"

services:
  # ==================== MySQL ====================
  mysql:
    image: mysql:8.0
    container_name: xueyifang-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xueyifang}
      TZ: Asia/Shanghai
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../xueyifang-backend/script/xueyifang-clean-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../../xueyifang-backend/script/v3_commercial_upgrade.sql:/docker-entrypoint-initdb.d/02-v3-commercial.sql:ro
      - ../../xueyifang-backend/script/v4_product_depth_upgrade.sql:/docker-entrypoint-initdb.d/03-v4-depth.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - xueyifang-net

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: xueyifang-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - xueyifang-net

  # ==================== Backend ====================
  backend:
    build:
      context: ../../xueyifang-backend
      dockerfile: ../deploy/docker/Dockerfile.backend
    container_name: xueyifang-backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PASSWORD_SALT: ${PASSWORD_SALT:-xueyifang}
      FILE_STORAGE_TYPE: ${FILE_STORAGE_TYPE:-local}
    volumes:
      - uploads:/var/xueyifang/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xueyifang-net

  # ==================== Frontend (Nginx) ====================
  frontend:
    build:
      context: ../../xueyifang-frontend
      dockerfile: ../deploy/docker/Dockerfile.frontend
    container_name: xueyifang-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - xueyifang-net

volumes:
  mysql-data:
  redis-data:
  uploads:

networks:
  xueyifang-net:
    driver: bridge
