# Docker 环境配置模板（敏感凭据全部从环境变量读取）
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:xueyifang}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useUnicode=true
    username: ${DB_USERNAME:root}
    password: ${MYSQL_ROOT_PASSWORD}

  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}

jwt:
  secret: ${JWT_SECRET}

payment:
  webhook-secret: ${PAYMENT_WEBHOOK_SECRET}
  sandbox-enabled: false

xueyifang:
  edu-verify:
    dev-preview-enabled: false
  security:
    cert-hmac-secret: ${CERT_HMAC_SECRET:${JWT_SECRET}}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    expose-docs-public: false

knife4j:
  enable: false
  production: true

file:
  storage:
    type: ${FILE_STORAGE_TYPE:local}
    local:
      upload-path: /var/xueyifang/uploads

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.xueyifang: info
    org.springframework: warn
