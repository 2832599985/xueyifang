server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: xueyifang-backend
  
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:xueyifang}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useUnicode=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:changeme}
    
  # Redis配置
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DB:0}
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  
  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

# Knife4j配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# JWT配置
jwt:
  tokenHeader: Authorization         # JWT存储的请求头
  secret: ${JWT_SECRET:xueyifang-dev-jwt-secret-change-in-production}  # jwt加解密使用的密钥（生产环境务必通过环境变量注入）
  expiration: 604800000              # JWT的超时时间（7天，单位毫秒）
  tokenHead: Bearer                  # JWT负载中的开头（Bearer）

# 密码加密配置
password:
  salt: xueyifang                    # 密码加密盐值

# 学艺坊业务配置
xueyifang:
  user:
    # 用户昵称前缀配置
    nickname-prefix: xueyifang

# 文件存储配置
file:
  storage:
    # 存储类型：local(默认本地存储，开箱即用) / oss(兼容 S3 / SeaweedFS / MinIO / 阿里云 OSS 对象存储)
    type: ${FILE_STORAGE_TYPE:local}
    
    # 本地存储配置（当 FILE_STORAGE_TYPE=local 时启用）
    local:
      upload-path: ${FILE_LOCAL_UPLOAD_PATH:uploads}
      url-prefix: /api/file/view
      enable-date-path: true
      
    # S3 / OSS 对象存储配置（当 FILE_STORAGE_TYPE=oss 时通过环境变量或 application-local.yml 注入）
    oss:
      endpoint: ${OSS_ENDPOINT:http://localhost:9000}
      access-key-id: ${OSS_ACCESS_KEY_ID:your-access-key-id}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:your-access-key-secret}
      bucket-name: ${OSS_BUCKET_NAME:xueyifang}
      url-prefix: ${OSS_URL_PREFIX:http://localhost:9000/xueyifang}
      
    # 允许的图片格式
    allowed-types:
      - jpg
      - jpeg
      - png
      - gif
      - webp

# 日志配置
logging:
  level:
    com.xueyifang: debug
    org.springframework: info
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'

